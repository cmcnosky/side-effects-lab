name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-main:
    name: Python 3.12 stable foundation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      UV_NO_EDITABLE: "1"
      UV_PYTHON: "3.12"

    steps:
      - name: Check out the curated source tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the lockfile
        run: uv lock --check

      - name: Install the locked development environment
        run: uv sync --locked --all-groups --no-editable

      - name: Run the stable foundation gate offline
        env:
          UV_OFFLINE: "1"
        run: |
          uv run --locked --no-sync ruff check .
          uv run --locked --no-sync ruff format --check .
          uv run --locked --no-sync mypy src
          uv run --locked --no-sync pytest
          uv run --locked --no-sync sel
